<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aethelred – protótipo de blocos</title>
<style>
:root{--bg:#0b0a0d;--ink:#e8e0d0;--bone:#e6dcc3;--blood:#8f1d1d;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.55) 100%)}
#hud{position:fixed;left:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;max-width:360px;pointer-events:none;line-height:1.5;font-size:15px;text-shadow:0 1px 5px #000}
#hud h1{margin:0 0 4px;font-size:20px;font-weight:normal;color:var(--bone);letter-spacing:.02em}
#hud p{margin:0}
#state{color:#d44;transition:color .3s}
.btn{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));border:1px solid #6b5a4a;background:rgba(20,16,16,.7);color:var(--bone);font:inherit;font-size:16px;padding:12px 18px;border-radius:6px;cursor:pointer}
.btn:active{background:var(--blood)}
#atk{right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#vida{color:var(--bone);transition:color .1s}
#combo{color:var(--bone);min-height:1.5em}
#glbBtn{right:18px;top:calc(14px + env(safe-area-inset-top,0px));bottom:auto}
#foesBtn{right:18px;top:calc(76px + env(safe-area-inset-top,0px));bottom:auto}
#pauseBtn{right:18px;top:calc(138px + env(safe-area-inset-top,0px));bottom:auto}
#soundBtn{right:18px;top:calc(200px + env(safe-area-inset-top,0px));bottom:auto}
#musicBtn{right:18px;top:calc(262px + env(safe-area-inset-top,0px));bottom:auto}
#godBtn{right:18px;top:calc(324px + env(safe-area-inset-top,0px));bottom:auto}
#modelBtn{right:18px;top:calc(386px + env(safe-area-inset-top,0px));bottom:auto}
#mapBtn{right:18px;top:calc(448px + env(safe-area-inset-top,0px));bottom:auto}
#slowBtn{right:18px;top:calc(510px + env(safe-area-inset-top,0px));bottom:auto}
#armBtn{right:18px;top:calc(572px + env(safe-area-inset-top,0px));bottom:auto}
#bloodBtn{right:18px;top:calc(634px + env(safe-area-inset-top,0px));bottom:auto}
#slowBtn.on{border-color:#d8b25a;color:#f0d68a}
#obj{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));text-align:center;pointer-events:none;font-size:15px;line-height:1.45;text-shadow:0 1px 5px #000;color:var(--bone);display:none}
#obj b{color:#f0d68a;font-weight:normal}
#pmsg{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);text-align:center;pointer-events:none;font-size:24px;text-shadow:0 2px 8px #000;color:#f0d68a;opacity:0;transition:opacity .4s}
#mini{position:fixed;left:16px;bottom:calc(170px + env(safe-area-inset-bottom,0px));pointer-events:none;display:none;opacity:.85}
#godBtn.on{border-color:#d8b25a;color:#f0d68a}
#glbMsg{margin-top:8px;font-size:13px;color:var(--bone);opacity:.85}
#pad{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid #6b5a4a;background:rgba(20,16,16,.45);display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#6b5a4a}
@media (pointer:coarse){#pad{display:block}}
#soundHint{display:none;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 16px;border:1px solid #d8b25a;border-radius:6px;background:rgba(20,16,16,.85);color:#f0d68a;font-size:15px;text-align:center;z-index:5;pointer-events:none}
#dmg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(150,10,10,.6) 100%)}
</style>
</head>
<body>
<div id="dmg"></div>
<div id="soundHint">Som bloqueado pelo navegador: clique uma vez na tela (ou aperte uma tecla) para liberar.</div>
<div id="vig"></div>
<div id="hud">
  <h1>Aethelred, protótipo de blocos</h1>
  <p id="state">Forma normal</p>
  <p id="vida">Vida 100   Abatidos 0</p>
  <p id="combo"></p>
  <p id="glbMsg">Carregando o modelo da personagem...</p>
</div>
<div id="obj"></div>
<div id="pmsg"></div>
<canvas id="mini" width="96" height="300"></canvas>
<div id="pad"><div id="knob"></div></div>
<button class="btn" id="atk">Atacar</button>
<button class="btn" id="glbBtn">Carregar modelo GLB</button>
<button class="btn" id="foesBtn">Inimigos: ligados</button>
<button class="btn" id="pauseBtn">Pausar</button>
<button class="btn" id="soundBtn">Som: ligado</button>
<button class="btn" id="musicBtn">Música: ligada</button>
<button class="btn" id="armBtn">Braço mutante: novo</button>
<button class="btn" id="slowBtn">Câmera lenta: não</button>
<button class="btn" id="bloodBtn">Sangue: ligado</button>
<button class="btn" id="mapBtn">Ir para a Prisão</button>
<button class="btn" id="godBtn">Invencível: não</button>
<button class="btn" id="modelBtn">Modelo: Mixamo</button>
<input type="file" id="glbIn" accept=".glb" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0a0d);
scene.fog=new THREE.FogExp2(0x0b0a0d,0.03);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);

/* luzes */
const hemi=new THREE.HemisphereLight(0x556080,0x1a1412,.55);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x9fb0d8,.7);
moon.position.set(-14,24,10);moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);moon.shadow.bias=-.0004;moon.shadow.normalBias=.02;
/* a sombra acompanha a personagem: área menor = sombra mais nítida */
Object.assign(moon.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:70});
scene.add(moon);scene.add(moon.target);
/* luz de contorno: vem de trás da personagem (oposta à câmera) e destaca a silhueta */
const rim=new THREE.DirectionalLight(0x8fa6d8,.55);scene.add(rim);scene.add(rim.target);
/* reflexos: mapa de ambiente simples (céu escuro azulado em cima, chão quente embaixo, brilhos de tocha) */
{const es=new THREE.Scene(),eg=new THREE.SphereGeometry(10,24,12),ec=[];
 for(let i=0;i<eg.attributes.position.count;i++){const y=eg.attributes.position.getY(i)/10;const c=new THREE.Color(0x2a3550).lerp(new THREE.Color(0x3a2a1e),Math.max(0,-y)*1.2);if(y>0)c.lerp(new THREE.Color(0x4a5a80),y);ec.push(c.r,c.g,c.b);}
 eg.setAttribute('color',new THREE.Float32BufferAttribute(ec,3));es.add(new THREE.Mesh(eg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 [[-6,1,-6],[6,1,-6],[-8,1,4]].forEach(function(p){const b=new THREE.Mesh(new THREE.SphereGeometry(.8,8,8),new THREE.MeshBasicMaterial({color:0xffa050}));b.position.set(p[0],p[1],p[2]);es.add(b);});
 const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,.04).texture;pm.dispose();}
/* brilho em volta das chamas (sprite aditivo) */
const GLOW=(function(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,200,120,1)');g.addColorStop(.25,'rgba(255,140,50,.5)');g.addColorStop(1,'rgba(255,90,20,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7});})();
function glow(parent,pos,s){const sp=new THREE.Sprite(GLOW);sp.position.copy(pos);sp.scale.set(s,s,s);parent.add(sp);return sp;}
/* poeira no ar: partículas que flutuam devagar em volta da personagem (a caixa acompanha, as partículas dão a volta) */
const DUST=(function(){const n=260,R=9,H=6,p=new Float32Array(n*3),v=[];
  for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*2*R;p[i*3+1]=Math.random()*H;p[i*3+2]=(Math.random()-.5)*2*R;v.push([(Math.random()-.5)*.08,(Math.random()-.3)*.05,(Math.random()-.5)*.08]);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d'),gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,230,200,.9)');gr.addColorStop(1,'rgba(255,230,200,0)');x.fillStyle=gr;x.fillRect(0,0,32,32);
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.05,map:new THREE.CanvasTexture(c),transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,color:0xd8c0a0}));
  pts.frustumCulled=false;scene.add(pts);let last=performance.now();
  return {update:function(cx,cy,cz){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
    for(let i=0;i<n;i++){const k=i*3;p[k]+=v[i][0]*dt;p[k+1]+=v[i][1]*dt;p[k+2]+=v[i][2]*dt;
      const wx=p[k]-cx,wz=p[k+2]-cz,wy=p[k+1]-cy;
      if(wx>R)p[k]-=2*R;else if(wx<-R)p[k]+=2*R;if(wz>R)p[k+2]-=2*R;else if(wz<-R)p[k+2]+=2*R;if(wy>H)p[k+1]-=H;else if(wy<0)p[k+1]+=H;}
    g.attributes.position.needsUpdate=true;}};})();
const torches=[];
[[-9,-19.5],[9,-19.5],[-28,-6],[28,-6]].forEach(p=>{
  const l=new THREE.PointLight(0xff8a3a,1.2,16,2);l.position.set(p[0],3.2,p[1]);scene.add(l);torches.push(l);
  const f=new THREE.Mesh(new THREE.SphereGeometry(.14,8,8),new THREE.MeshBasicMaterial({color:0xffb060,toneMapped:false}));
  f.position.copy(l.position);scene.add(f);glow(scene,l.position,1.6);
});

const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
/* pedra: textura procedural (blocos, argamassa, ruído) aplicada em coordenadas do mundo (triplanar) com relevo,
   para não depender das UVs das caixas e cilindros do cenário */
function makeStone(seed,NR){const N=512,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N),d=im.data;
  let sd=seed;const rnd=function(){sd=(sd*16807)%2147483647;return sd/2147483647;};
  const G=32,lat=[];for(let i=0;i<G*G;i++)lat.push(rnd());
  const vn=function(u,v,f){u*=f;v*=f;const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,su=fu*fu*(3-2*fu),sv=fv*fv*(3-2*fv);
    const L=function(a,b){return lat[((((b%f)+f)%f)%G)*G+((((a%f)+f)%f)%G)];};
    return (L(i,j)*(1-su)+L(i+1,j)*su)*(1-sv)+(L(i,j+1)*(1-su)+L(i+1,j+1)*su)*sv;};
  const fbm=function(u,v){return vn(u,v,4)*.5+vn(u,v,8)*.25+vn(u,v,16)*.15+vn(u,v,32)*.1;};
  const RH=N/NR,rows=[];for(let r=0;r<NR;r++){const cuts=[0];let a=0;while(a<N-60){a+=70+rnd()*110;if(a>N-50)break;cuts.push(a);}cuts.push(N);
    const off=rnd()*N,tones=cuts.map(function(){return .86+rnd()*.22;});rows.push({cuts:cuts,off:off,tones:tones});}
  for(let py=0;py<N;py++){const r=Math.floor(py/RH),R=rows[r],ly=py-r*RH;
    for(let px=0;px<N;px++){const qx=(px+R.off)%N;let k=0;while(R.cuts[k+1]<=qx)k++;
      const dx=Math.min(qx-R.cuts[k],R.cuts[k+1]-qx),dy=Math.min(ly,RH-ly),ed=Math.min(dx,dy)+(vn(px/N,py/N,16)-.5)*3;
      const u=px/N,v=py/N,n=fbm(u,v),h0=Math.min(1,Math.max(0,(ed-1)/7));
      const h=h0*(.75+n*.35)-(1-h0)*.15+vn(u,v,32)*.08;
      let t=(.62+.38*h0)*R.tones[k]*(.78+n*.42);t=Math.max(0,Math.min(1,t*.62));
      const o=(py*N+px)*4;d[o]=t*255*1.04;d[o+1]=t*255;d[o+2]=t*255*.94;d[o+3]=Math.max(0,Math.min(255,h*255));}}
  x.putImageData(im,0,0);const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=renderer.capabilities.getMaxAnisotropy();tx.premultiplyAlpha=false;return tx;}
const STONE=makeStone(7,6),FLAG=makeStone(11,4);
/* sujeira em grande escala (manchas que quebram a repetição dos blocos) */
const GRIME=(function(){const N=128,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N),d=im.data,G=16,L=[];for(let i=0;i<G*G*4;i++)L.push(Math.random());
  const vn=function(u,v,f){u*=f;v*=f;const i=Math.floor(u),j=Math.floor(v),a=u-i,b=v-j,sa=a*a*(3-2*a),sb=b*b*(3-2*b),q=function(p,r){return L[((r%f+f)%f)*G+((p%f+f)%f)];};return (q(i,j)*(1-sa)+q(i+1,j)*sa)*(1-sb)+(q(i,j+1)*(1-sa)+q(i+1,j+1)*sa)*sb;};
  for(let y=0;y<N;y++)for(let X=0;X<N;X++){const u=X/N,v=y/N,n=vn(u,v,2)*.5+vn(u,v,4)*.3+vn(u,v,8)*.2,o=(y*N+X)*4;d[o]=d[o+1]=d[o+2]=n*255;d[o+3]=255;}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})();
function stoneify(m,scale,bump,tex){
  m.extensions={derivatives:true};m.envMapIntensity=.08;
  m.onBeforeCompile=function(sh){
    sh.uniforms.uStone={value:tex||STONE};sh.uniforms.uGrime={value:GRIME};sh.uniforms.uSS={value:1/scale};sh.uniforms.uBump={value:bump};
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vSWP,vSWN;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvSWP=(modelMatrix*vec4(transformed,1.)).xyz;vSWN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uStone,uGrime;uniform float uSS,uBump;varying vec3 vSWP,vSWN;')
      .replace('#include <map_fragment>',`vec3 sbw=pow(abs(vSWN),vec3(4.));sbw/=sbw.x+sbw.y+sbw.z;
vec4 stx=texture2D(uStone,vSWP.zy*uSS),sty=texture2D(uStone,vSWP.xz*uSS),stz=texture2D(uStone,vSWP.xy*uSS);
vec4 sc=stx*sbw.x+sty*sbw.y+stz*sbw.z;float stoneH=sc.a;float sg=texture2D(uGrime,vSWP.xz*.045+vSWP.y*.03).r;diffuseColor.rgb*=pow(sc.rgb,vec3(2.2))*4.*mix(.45,1.2,sg);`)
      .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor*=mix(1.,.82,stoneH);')
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
{vec3 sx=dFdx(-vViewPosition),sy=dFdy(-vViewPosition),sR1=cross(sy,normal),sR2=cross(normal,sx);float fd=dot(sx,sR1)*(gl_FrontFacing?1.:-1.);
 vec3 gr=sign(fd)*(dFdx(stoneH)*sR1+dFdy(stoneH)*sR2)*uBump;normal=normalize(abs(fd)*normal-gr);}`);
  };return m;}
const M={cloth:mat(0x2a2a30),leather:mat(0x3b2a22),trou:mat(0x1d1c20),red:mat(0x7a1414,.9),muscle:mat(0x9c2b2b,.5),bone:mat(0xe6dcc3,.3),skin:mat(0xb08868,.7),stone:stoneify(mat(0x3a3836,1),2.2,.18),stone2:stoneify(mat(0x2b2a29,1),1.6,.18)};

/* cenário */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),stoneify(mat(0x1e1c19,1),4.5,.05,FLAG));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const boxes=[],circles=[];
function block(x,z,w,h,d,m,solid){
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||M.stone);
  b.position.set(x,h/2,z);b.castShadow=b.receiveShadow=true;scene.add(b);
  if(solid)boxes.push({x:x,z:z,hw:w/2,hd:d/2,h:h});return b;
}
/* muralhas com ameias */
block(0,-22,60,9,3,M.stone,true);
block(-30,0,3,9,45,M.stone,true);
block(30,0,3,9,45,M.stone,true);
for(let i=-14;i<=14;i++){
  block(i*2,-22,1.1,1.2,3,M.stone2,false).position.y=9.6;
  block(-30,i*1.6,3,1.2,1.0,M.stone2,false).position.y=9.6;
  block(30,i*1.6,3,1.2,1.0,M.stone2,false).position.y=9.6;
}
/* torre */
const tower=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.8,20,12),M.stone);
tower.position.set(-24,10,-17);tower.castShadow=true;scene.add(tower);
circles.push({x:-24,z:-17,r:3.8,h:20});
const spire=new THREE.Mesh(new THREE.ConeGeometry(4,7,12),mat(0x1d1b1f));
spire.position.set(-24,23.5,-17);scene.add(spire);
/* pilares e entulho */
[[-8,-8],[8,-8],[-8,6],[8,6]].forEach(p=>{
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.9,1,7,10),M.stone);
  c.position.set(p[0],3.5,p[1]);c.castShadow=c.receiveShadow=true;scene.add(c);
  circles.push({x:p[0],z:p[1],r:1.1,vr:.95,h:7});
});
for(let i=0;i<40;i++){
  const s=.2+Math.random()*.5;
  const r=new THREE.Mesh(new THREE.BoxGeometry(s,s*.7,s),M.stone2);
  r.position.set((Math.random()-.5)*52,s*.3,-18+Math.random()*42);
  r.rotation.y=Math.random()*3;r.castShadow=true;scene.add(r);
}

/* personagem */
const hero=new THREE.Group();scene.add(hero);
function part(g,m,x,y,z,parent){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;(parent||hero).add(o);return o;}
const torso=new THREE.Group();torso.position.y=1.0;hero.add(torso);
part(new THREE.BoxGeometry(.74,.85,.42),M.cloth,0,.45,0,torso);
part(new THREE.BoxGeometry(.78,.12,.46),M.leather,0,0,0,torso);
part(new THREE.BoxGeometry(.8,.1,.46),M.leather,0,.3,0,torso);
part(new THREE.BoxGeometry(.2,.16,.1),mat(0x8a7a60,.4,.6),0,0,.25,torso);
part(new THREE.BoxGeometry(.84,.2,.5),M.leather,0,.86,0,torso);
const head=new THREE.Group();head.position.set(0,1.58,0);torso.add(head);
part(new THREE.SphereGeometry(.19,12,12),M.skin,0,0,.04,head);
const hood=part(new THREE.SphereGeometry(.29,12,12),M.cloth,0,.03,-.04,head);hood.scale.set(1,1.05,1.1);
part(new THREE.ConeGeometry(.2,.4,10),M.cloth,0,-.04,-.28,head).rotation.x=-1.9;
part(new THREE.SphereGeometry(.04,6,6),new THREE.MeshBasicMaterial({color:0xffe9a8}),-.07,.02,.2,head);
part(new THREE.SphereGeometry(.04,6,6),new THREE.MeshBasicMaterial({color:0xffe9a8}),.07,.02,.2,head);
/* capa */
const cape=new THREE.Group();cape.position.set(0,1.0+.85,-.25);hero.add(cape);
const strips=[];
[.95,1.2,1.38,1.15,.9].forEach((h,i)=>{
  const s=new THREE.Group();s.position.set((i-2)*.15,0,0);cape.add(s);
  part(new THREE.BoxGeometry(.14,h,.03),M.red,0,-h/2,0,s);strips.push(s);
});
/* pernas */
const legs=[-1,1].map(s=>{
  const g=new THREE.Group();g.position.set(s*.2,1.0,0);hero.add(g);
  part(new THREE.BoxGeometry(.26,.95,.28),M.trou,0,-.45,0,g);

function hitEnemies(A){

  let any=false,blocked=false;

    if(e.dead)return;
    const dx=e.g.position.x-st.x,dz=e.g.position.z-st.z,d=Math.hypot(dx,dz);
    if(d>R+.3+(e.sc>1.4?.5:0))return;
    if(Math.abs(e.g.position.y-st.y)>1.8)return;
    if(d>.9&&(dx*fx+dz*fz)/d<cosArc)return;
    /* escudeiro: golpe comum pela frente bate no escudo (passa o golpe final, o transformado e quem vem por trás) */
    if(e.type==='shield'&&!A.finisher&&!st.morphOn&&!(e.stun>0)){const ex=Math.sin(e.g.rotation.y),ez=Math.cos(e.g.rotation.y);
      if(d<.01||(-dx*ex-dz*ez)/d>.35){blocked=true;e.vx=dx/(d||1)*3;e.vz=dz/(d||1)*3;return;}}

  if(!god)hp-=dmg;hurt=.6;

  if(!combo.active&&combo.w<.05)plantFeet();

function updateCombat(dt){
  hurt-=dt;msgT-=dt;
  spawnT-=dt;
  const alive=enemies.filter(function(e){return !e.dead;}).length;
  pmsgT-=dt;if(pmsgT<=0&&pmsgEl.style.opacity!=='0')pmsgEl.style.opacity=0;
  if(WORLD==='prison')prisonUpdate(dt);
  updateProjs(dt);
  if(WORLD==='arena'&&foesOn&&alive<6&&spawnT<=0){spawnEnemy();spawnT=2.5;}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],p=e.g.position;
    if(e.held){e.g.rotation.x=.25;continue;}
    /* altura: cai depois de solto ou lançado pelo gancho */
    if(p.y>e.fy||e.vy){e.vy=(e.vy||0)-22*dt;p.y=Math.max(e.fy,p.y+e.vy*dt);if(p.y<=e.fy){e.vy=0;}}
    if(e.dead){e.dead+=dt;e.g.rotation.x=e.thrown&&p.y>0?e.g.rotation.x-dt*9:-Math.min(e.dead/.4,1)*1.5;p.x+=e.vx*dt;p.z+=e.vz*dt;const f=Math.max(0,1-dt*(p.y>0?.3:6));e.vx*=f;e.vz*=f;if(e.dead>3){scene.remove(e.g);enemies.splice(i,1);}continue;}
    const dx=st.x-p.x,dz=st.z-p.z,d=Math.hypot(dx,dz)||1;
    if(enemyAI(e,dt,dx,dz,d))continue;
    e.stun-=dt;
    /* arremessador: anuncia o agarrão (braços sobem, pisca laranja) e, se o herói ainda estiver perto, agarra e arremessa */
    if(e.type==='grab'){e.gcd-=dt;
      if(e.throwing){e.g.rotation.y=Math.atan2(dx,dz);e.A.forEach(function(a){a.rotation.x=-2.4;});e.warn=0;
        p.x+=e.vx*dt;p.z+=e.vz*dt;e.vx*=.9;e.vz*=.9;e.flash=Math.max(0,e.flash-dt);continue;}
      if(e.gw>0){e.gw-=dt;e.g.rotation.y=Math.atan2(dx,dz);const k=1-e.gw/.6;e.A.forEach(function(a){a.rotation.x=-1.35-1.0*k;});e.warn=(Math.floor(e.gw*12)%2)?1:0;
        if(e.gw<=0){e.warn=0;e.A.forEach(function(a){a.rotation.x=-1.35;});if(d<1.9&&canThrowHero())startHeroThrown(e);else{e.gcd=2.6;}}
        e.mats.forEach(function(m){m.emissive.setHex(e.warn?0x5a2c00:0);});continue;}
      if(e.stun<=0&&d<1.55&&e.gcd<=0&&canThrowHero()){e.gw=.6;}
    }
    if(e.stun<=0){
      e.g.rotation.y=Math.atan2(dx,dz);e.g.rotation.x=0;
      if(d>1){p.x+=dx/d*e.sp*dt;p.z+=dz/d*e.sp*dt;}
      else if(!death&&!climb&&Math.abs(st.y-p.y)<1.2){e.cd-=dt;if(e.cd<=0&&hurt<=0){e.cd=1;takeHit(p.x,p.z,8);}}
    }else e.g.rotation.x=Math.min(e.stun,.4)*.6;
    p.x+=e.vx*dt;p.z+=e.vz*dt;
    const f=Math.max(0,1-dt*8);e.vx*=f;e.vz*=f;
    e.ph+=dt*e.sp*4;e.L[0].rotation.x=Math.sin(e.ph)*.6;e.L[1].rotation.x=-Math.sin(e.ph)*.6;
    e.flash=Math.max(0,e.flash-dt);
    const em=e.flash>0?0x661111:0;e.mats.forEach(function(m){m.emissive.setHex(em);});
    clampEnemy(e);
  }
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i].g.position,b=enemies[j].g.position;
    if(enemies[i].dead||enemies[j].dead)continue;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<.7&&d>0){const m=(.7-d)/2;a.x-=dx/d*m;a.z-=dz/d*m;b.x+=dx/d*m;b.z+=dz/d*m;}
  }
  if(hp<=0&&!death){if(!startDeath())respawn();}
  if(death){death.t+=dt;if(death.t>death.dur+1.6)respawn();}
  const txt=death?'Você caiu.':msgT>0?'Recomeçando.':'Vida '+Math.max(0,Math.ceil(hp))+(god?' (invencível)':'')+'   Abatidos '+kills;
  if(vidaEl.textContent!==txt)vidaEl.textContent=txt;
  vidaEl.style.color=hurt>0?'#ff6a6a':'';

  const ok=DEATHS.filter(function(n){return clipSrc[n];});
  if(!ok.length)return null;
  if(!deathBag.length){deathBag=ok.slice().sort(function(){return Math.random()-.5;});if(deathBag[0]===lastDeath&&deathBag.length>1)deathBag.push(deathBag.shift());}
  return lastDeath=deathBag.shift();

function startDeath(){
  const n=nextDeath();if(!n||!rig||!baseBones)return false;

  if(grab&&grab.e)grab.e.held=false;grab=null;airAtk=null;flip=null;dodge=null;
  death={name:n,t:0,dur:clipSrc[n].clip.duration,rmPrev:null,thud:false,snap:baseBones.map(function(b){return [b.quaternion.clone(),b.position.clone()];}),off:null};
  combo.active=false;combo.hold=0;combo.w=0;combo.i=-1;combo.outDur=0;

  st.x=0;st.z=8;st.y=0;st.vy=0;spawnT=2;msgT=2.5;combo.active=false;combo.i=-1;combo.w=0;combo.hold=0;

function airAtkArms(ct,t){

    const sg=s==='Right'?1:-1,sh=wp(B[s+'Arm']);
    const up=sh.clone().addScaledVector(UPV,.5*L).addScaledVector(R,sg*.62*L).addScaledVector(F,-.12*L);
    const mid=sh.clone().addScaledVector(R,sg*.85*L).addScaledVector(F,.35*L).addScaledVector(UPV,-.1*L);
    const end=new THREE.Vector3(st.x,st.y+.22,st.z).addScaledVector(F,.72).addScaledVector(R,sg*.13);

function clawFingers(c,open){
  ['Left','Right'].forEach(function(s){
    rig[s].fingers.forEach(function(fg){
      const th=fg.f==='Thumb'?.5:1;
      for(let i=0;i<3;i++){const kk=c<0?[.3,1.1,.45][i]:[.35,.6,.4][i];twistB(fg.b[i],fg.ax[i],c*kk*th);}

/* chegada ao topo: (1) assim que as mãos alcançam a borda, Braced Hang To Crouch (pendurado na borda, puxa o corpo

   (2) mistura do agachado para a pose parada */

function updateClimb(dt,ix,iz,spaceDown){
  const C=climb;C.t+=dt;
  const F=wallFrame(C);
  /* segurança: se o estado da escalada ficar incoerente (longe da parede que deveria estar segurando, ou valores
     inválidos), sai da escalada em pé no chão em vez de ficar presa na orientação da parede */
  const off=hero.position.clone().sub(F.p);off.y=0;
  if(!C.mantle&&C.t>.3&&(!isFinite(C.y)||!isFinite(hero.position.x)||off.length()>1.6)){
    const out=F.p.clone().addScaledVector(F.n,.6);out.y=groundY(out.x,out.z);endClimb(out,Math.atan2(-F.n.x,-F.n.z),snapBones());return;

      hero.quaternion.copy(M.q0).slerp(M.q1,sm(M.t/.2));

    }
    st.x=hero.position.x;st.y=hero.position.y;st.z=hero.position.z;st.speed=0;
    return;
  }
  if(spaceDown&&C.t>.2&&clipSrc.sflip){
    /* salto da parede: a Stylish Flip inteira de trás para frente, de pé e de frente para a parede (ver poseFlipRev) */
    const hw=wp(rig.B.Hips),pos=F.p.clone().addScaledVector(F.n,.35);pos.y=hw.y-rig.restP.Hips.y;
    endClimb(pos,Math.atan2(-F.n.x,-F.n.z),snapBones());

    flip={rev:true,t:0,y0:pos.y,rmPrev:null,I:climbOut?{snap:climbOut.snap,off:null,t:0}:null};climbOut=null;

       e cai em pé (ver poseFlip) */

    endClimb(out,Math.atan2(-F.n.x,-F.n.z),snapBones());

  const v=Math.hypot(vr,vy);C.moving+=((v>.1?1:0)-C.moving)*Math.min(1,dt*8);
  C.phase+=v*dt/CRAWL_STRIDE;

  if(C.y>=C.o.h-1.1&&vy>0&&clipSrc.hang){
    C.y=C.o.h-1.1;const F2=wallFrame(C),h=C.o.h;
    /* base escolhida para os pés terminarem em cima da borda; as mãos começam na borda */
    const p1=F2.p.clone().addScaledVector(F2.n,.32);p1.y=h-TOP_LEDGE*clipSrc.hang.scale;
    const p2=F2.p.clone().addScaledVector(F2.n,-.55);p2.y=h;
    C.mantle={t:0,p0:hero.position.clone(),q0:hero.quaternion.clone(),p1:p1,p2:p2,
      q1:new THREE.Quaternion().setFromAxisAngle(UPV,Math.atan2(-F2.n.x,-F2.n.z)),snap:snapBones(),off:null};
    return;
  }
  if(C.y>=C.o.h-1.1&&clipSrc.hang)C.y=C.o.h-1.1;
  /* embaixo: solta e fica de pé */
  if(C.y<=.3&&vy<0){const out=F.p.clone().addScaledVector(F.n,.45);out.y=0;endClimb(out,Math.atan2(-F.n.x,-F.n.z),snapBones());return;}
  const F3=wallFrame(C),q=wallQuat(F3,C.psi),k=sm(C.t/.25);

/* pose na parede: Running Crawl no ritmo do deslocamento, mistura de entrada e pés encostados na parede */
function inertBlend(I,dur){
  if(!I||!I.snap)return;

  if(!I.off)I.off=baseBones.map(function(b,i){return [I.snap[i][0].clone().multiply(b.quaternion.clone().invert()),I.snap[i][1].clone().sub(b.position)];});
  baseBones.forEach(function(b,i){b.quaternion.premultiply(_iq.copy(I.off[i][0]).slerp(_q.set(0,0,0,1),k));b.position.addScaledVector(I.off[i][1],1-k);});
  rig.m.updateMatrixWorld(true);
}
function poseClimb(dt){

    hero.position.copy(M.p0).lerp(M.p1,k).addScaledVector(F.n,-(rm.z-M.rm0.z)).addScaledVector(F.R,-(rm.x-M.rm0.x));

    if(w>0)['Left','Right'].forEach(function(s){
      const sh=wp(B[s+'Arm']),lat=Math.max(-.4,Math.min(.4,sh.clone().sub(F.p).dot(F.R)*1.1));
      const tg=F.p.clone().addScaledVector(F.n,-.1).addScaledVector(F.R,lat);tg.y=C.o.h+.03;
      const pole=F.n.clone().addScaledVector(F.R,Math.sign(lat)*.6).add(_v.set(0,-.3,0));

    });

  }

const TRAIL_N=26;

function updateTrail(dt,base,tip,on){

/* modelo GLB */
const glbMsg=document.getElementById('glbMsg');
let custom=null,mixer=null,acts={},curAct=null;
function say(t){glbMsg.textContent=t;}
function parseGLB(buf,name){
  try{
    new THREE.GLTFLoader().parse(buf,'',function(gltf){useModel(gltf,name);},function(){say('Não consegui abrir esse arquivo. Confira se é um .glb válido.');});
  }catch(err){say('Não consegui abrir esse arquivo. Confira se é um .glb válido.');}

function loadGLB(file){
  if(!file)return;
  if(!/\.glb$/i.test(file.name)){say('Use um arquivo .glb (um único arquivo com malha e texturas).');return;}
  say('Lendo '+file.name+'...');

/* lê um arquivo binário; no link de teste os .glb não são servidos, então lá eles vêm como .b64.txt */
function loadBinary(url,onBuf,onFail,onProg){
  const srcs=[{url:url,type:'arraybuffer'},{url:url+'.b64.txt',type:'text'}];
  function tryLoad(i){
    if(i>=srcs.length){onFail();return;}
    const s=srcs[i],xhr=new XMLHttpRequest();
    xhr.open('GET',s.url);xhr.responseType=s.type;
    if(onProg)xhr.onprogress=function(e){if(e.lengthComputable)onProg(e.loaded/e.total);};
    xhr.onload=function(){
      if(!(xhr.status>=200&&xhr.status<300||(xhr.status===0&&xhr.response))){tryLoad(i+1);return;}
      if(s.type==='text'){
        const bin=atob(xhr.response.replace(/\s+/g,'')),buf=new Uint8Array(bin.length);
        for(let k=0;k<bin.length;k++)buf[k]=bin.charCodeAt(k);
        onBuf(buf.buffer);
      }else onBuf(xhr.response);
    };
    xhr.onerror=function(){tryLoad(i+1);};
    xhr.send();
  }
  tryLoad(0);
}
/* dedos das mãos mutantes: cada dedo tem 3 juntas próprias (filhas do osso da mão) no caminho do próprio dedo até a
   ponta da garra (extras.fingerJoints, de ferramentas/dedos_mutantes.py). Em repouso elas não mudam nada (a matriz
   de ligação compensa a posição); dobrar uma junta gira só o seu dedo, em volta do próprio ponto */
function addClawBones(ud,bones,inv,bindM){
  const FN=ud.fingerNames,out={Right:[],Left:[]};let idx=ud.extraBase;
  ['Right','Left'].forEach(function(side){
    const hi=bones.findIndex(function(b){return b.name.replace(/^mixamorig[:_]?/,'')===side+'Hand';});if(hi<0)return;
    const hand=bones[hi],IBh=inv[hi],toQ=new THREE.Matrix4().multiplyMatrices(IBh,bindM);
    const Q=FN.map(function(f){return ud.fingerJoints[side][f].map(function(p){return new THREE.Vector3(p[0],p[1],p[2]).applyMatrix4(toQ);});});
    /* lado da palma: para onde as garras curvam, em relação à linha de cada dedo */
    const palm=new THREE.Vector3();
    Q.forEach(function(q,i){if(FN[i]==='Thumb')return;const d=q[1].clone().sub(q[0]).normalize(),t=q[3].clone().sub(q[0]);palm.add(t.sub(d.multiplyScalar(t.dot(d))));});
    palm.normalize();
    FN.forEach(function(f,fi){
      const q=Q[fi],chain=[];let parent=hand,prev=new THREE.Vector3();
      /* um eixo só por dedo: normal do plano da curva do dedo com a garra; girar no sentido + curva mais o dedo */
      const ax=new THREE.Vector3().crossVectors(q[1].clone().sub(q[0]),q[3].clone().sub(q[0]));
      if(ax.lengthSq()<1e-20){const d=q[1].clone().sub(q[0]).normalize();ax.crossVectors(d,palm);}
      ax.normalize();
      for(let k=0;k<3;k++){
        const bn=new THREE.Bone();bn.name='garra_'+side+f+(k+1);bn.position.copy(q[k]).sub(prev);parent.add(bn);bn.updateMatrixWorld(true);
        bones[idx]=bn;inv[idx]=new THREE.Matrix4().makeTranslation(-q[k].x,-q[k].y,-q[k].z).multiply(IBh);idx++;
        chain.push({b:bn,axis:ax});prev=q[k];parent=bn;
      }
      out[side].push({name:f,chain:chain,spreadAxis:palm.clone()});
    });
  });
  return out;
}
/* corrida transformada (perfil mixamo, braços mutantes): tronco bem inclinado para a frente e os braços para trás e
   abertos, quase retos, como uma asa-delta, com as garras longe do corpo; balançam pouco no ritmo da passada.
   MRUN: inclinação do tronco (rad), abertura e queda dos braços, balanço */
const MRUN={lean:.7,back:.72,open:.62,down:.42,sway:.07,head:.45};
let mRunW=0;
function poseMorphRun(dt){
  const free=PERFIL==='mixamo'&&armForm&&(armForm.shown||morphSeq)&&!combo.active&&aboveGround()<.05&&!grab&&!climb&&!dodge&&!tpose&&rig;
  poseMorphWalk(dt,free&&st.speed>.5&&!(runHeld()&&st.speed>5));
  poseMorphGuard(dt,free&&st.speed<=.5&&(combo.hold>0||combo.outDur>0||!!morphSeq));
  const on=free&&runHeld()&&st.speed>5;
  mRunW+=((on?1:0)-mRunW)*Math.min(1,dt*(on?5:8));if(mRunW<.01||!rig)return;
  const B=rig.B,w=sm(mRunW),F=new THREE.Vector3(Math.sin(st.rot),0,Math.cos(st.rot)),R=new THREE.Vector3().crossVectors(F,UPV).normalize();
  /* girar em volta de R com ângulo negativo inclina para a frente */
  const parts=[.34,.36,.30];rig.spine.forEach(function(n,i){rotAxis(B[n],R,-MRUN.lean*parts[i]*w);});
  if(B.Neck)rotAxis(B.Neck,R,MRUN.head*.5*w);rotAxis(B.Head,R,MRUN.head*.5*w);
  ['Left','Right'].forEach(function(s){
    const sg=s==='Right'?1:-1,sh=wp(B[s+'Arm']),L=rig.armLen;
    const sw=Math.sin(st.t*9.5+(s==='Left'?Math.PI:0))*MRUN.sway;
    const dir=F.clone().multiplyScalar(-MRUN.back+sw).addScaledVector(R,sg*(MRUN.open+sw*.5)).addScaledVector(UPV,-MRUN.down).normalize();
    const pole=UPV.clone().multiplyScalar(.6).addScaledVector(R,sg*.35).addScaledVector(F,.25);

/* caminhada transformada: as pernas e o quadril são os da caminhada normal; o tronco e os braços ficam na postura de
   guarda (clipe MorphWalk, montado ao carregar o modelo), com os ombros de frente, o tronco inclinado e os braços mais
   abertos, longe do corpo. MWALK: inclinação do tronco, abertura extra dos braços (rad), passo (m, só para o ritmo do
   balanço dos braços), balanço dos braços */
const MWALK={lean:.25,open:.38,stride:.6,sway:.1};

  mWalkW+=((on?1:0)-mWalkW)*Math.min(1,dt*(on?6:8));if(mWalkW<.01){mWalkPh=0;return;}
  const B=rig.B,w=sm(mWalkW),F=new THREE.Vector3(Math.sin(st.rot),0,Math.cos(st.rot)),R=new THREE.Vector3().crossVectors(F,UPV).normalize();
  mWalkPh+=dt*st.speed/(MWALK.stride*2)*Math.PI;

  const sl=wp(B.LeftArm).sub(wp(B.RightArm));sl.y=0;
  if(sl.lengthSq()>1e-8){const tgt=R.clone().negate();sl.normalize();rotAxis(B[rig.spine[0]],UPV,Math.atan2(_x.crossVectors(sl,tgt).dot(UPV),sl.dot(tgt))*w);}
  const parts=[.34,.36,.30];rig.spine.forEach(function(n,i){rotAxis(B[n],R,-MWALK.lean*parts[i]*w);});
  rotAxis(B.Head,R,MWALK.lean*.6*w);

  ['Left','Right'].forEach(function(s){const sg=s==='Right'?1:-1;
    rotAxis(B[s+'Arm'],F,-sg*MWALK.open*w);
    rotAxis(B[s+'Arm'],R,Math.sin(mWalkPh+(s==='Left'?0:Math.PI))*MWALK.sway*w);});

        if(Math.abs(p.x-s.x)<.85&&Math.abs(p.z-s.z)<.85&&Math.abs(p.y-s.f)<.35&&!(e.scd>0)){e.scd=.7;e.hp-=1.5;e.flash=.2;if(e.hp<=0){e.dead=.001;kills++;}}});}});

    torches.forEach(function(l,i){const t=near[i];if(t){l.position.set(t.x,t.y,t.z);l.distance=t.big?12:15;}});}

}
function nextWave(L){L.wave++;L.active=[];const r=L.rect;
  L.waves[L.wave].forEach(function(t){let x,z,k=0;do{x=r.x0+1.5+Math.random()*(r.x1-r.x0-3);z=r.z0+1.5+Math.random()*(r.z1-r.z0-3);k++;}while(Math.hypot(x-st.x,z-st.z)<5&&k<20);
    const e=addEnemy(t,x,z,r,r.f);e.aggro=true;e.wave=L;L.active.push(e);});
  flashMsg(L.name+': onda '+(L.wave+1)+' de '+L.waves.length,1.6);
}
function prisonRespawn(){
  if(heroThrown&&heroThrown.e)heroThrown.e.throwing=false;heroThrown=null;
  if(grab&&grab.e)grab.e.held=false;grab=null;wallFall=false;airAtk=null;flip=null;dodge=null;climb=null;hero.quaternion.set(0,0,0,1);
  death=null;hp=100;combo.active=false;combo.i=-1;combo.w=0;combo.hold=0;st.vy=0;st.vx=st.vz=0;
  const c=prison.cps[prison.cp];st.x=c.x;st.z=c.z+1.6;st.y=c.f;st.rot=st.rotT=Math.PI;st.yaw=0;
  projs.forEach(function(q){scene.remove(q.m);});projs=[];
  /* salas de ondas não terminadas recomeçam; inimigos vivos voltam ao lugar com vida cheia; o chefe recomeça */
  prison.locks.forEach(function(L){if(L.cleared)return;lockRoom(L,false);L.wave=-1;L.active=[];});
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(e.wave&&!e.wave.cleared){scene.remove(e.g);enemies.splice(i,1);continue;}
    if(e.dead)continue;
    e.hp=e.maxhp;e.g.position.set(e.home.x,e.home.fy,e.home.z);e.fy=e.home.fy;e.zone=e.home.zone;e.aggro=false;e.stun=0;e.groggy=0;e.wind=0;e.warn=0;e.vx=e.vz=e.vy=0;e.leap=false;e.held=false;e.throwing=false;
    if(e.B)e.B={phase:1,st:'chase',t:0,cd:1,started:false};}
  if(!prison.done)lockRoom(prison.bossIn,false);
  msgT=2.5;plantFeet();
}
/* ---------- entrar e sair ---------- */
const helpEl={style:{}},mapBtn=document.getElementById('mapBtn'),miniEl=document.getElementById('mini'),miniCtx=miniEl.getContext('2d');
const ARENA_TORCH=torches.map(function(l){return l.position.clone();});
function clearWorld(){
  if(heroThrown&&heroThrown.e)heroThrown.e.throwing=false;heroThrown=null;
  if(grab&&grab.e)grab.e.held=false;grab=null;climb=null;flip=null;airAtk=null;dodge=null;death=null;wallFall=false;hero.quaternion.set(0,0,0,1);
  enemies.forEach(function(e){scene.remove(e.g);});enemies.length=0;projs.forEach(function(q){scene.remove(q.m);});projs=[];
  combo.active=false;combo.i=-1;combo.w=0;combo.hold=0;st.vy=0;st.vx=st.vz=0;st.morphOn=false;hp=100;
}
function enterPrison(){
  buildPrison();clearWorld();WORLD='prison';
  abil.climb=abil.grab=abil.morph=false;
  prison.altars.forEach(function(a){a.taken=false;});prison.cps.forEach(function(c,i){c.lit=i===0;});prison.cp=0;prison.done=false;prison.won=false;
  prison.locks.forEach(function(L){L.cleared=false;L.closed=true;lockRoom(L,false);L.wave=-1;L.active=[];});
  prison.bossIn.closed=true;lockRoom(prison.bossIn,false);prison.bossOut.closed=false;lockRoom(prison.bossOut,true);
  prison.cracks.forEach(function(c){if(c.broken){c.broken=false;boxes.push(c);c.mesh.visible=true;(c.lines||[]).forEach(function(l){l.visible=true;});}c.told=false;});
  Object.keys(prison.seen).forEach(function(k){prison.seen[k]=false;});
  prisonPopulate();
  st.x=PX;st.z=11;st.y=0;st.rot=st.rotT=Math.PI;st.yaw=0;
  hemi.intensity=.32;moon.intensity=.28;
  mapBtn.textContent='Voltar à Arena';objEl.style.display='block';miniEl.style.display='block';helpEl.style.display='none';
  flashMsg('A Prisão<br><span style="font-size:16px;color:#e8e0d0">Fuja das celas até a torre do Carcereiro.</span>',3.5);
  plantFeet();
}
function enterArena(){
  clearWorld();WORLD='arena';abil.climb=abil.grab=abil.morph=true;
  st.x=0;st.z=8;st.y=0;st.rot=st.rotT=Math.PI;
  torches.forEach(function(l,i){l.position.copy(ARENA_TORCH[i]);l.distance=16;});
  hemi.intensity=.55;moon.intensity=.7;
  mapBtn.textContent='Ir para a Prisão';helpEl.style.display='';objEl.style.display='none';miniEl.style.display='none';pmsgEl.style.opacity=0;
  if(foesOn)for(let i=0;i<3;i++)spawnEnemy();
  plantFeet();
}
function toggleWorld(){if(WORLD==='arena')enterPrison();else enterArena();mapBtn.blur();}
mapBtn.onclick=toggleWorld;
/* teclas 1–6 na prisão: vai direto a cada trecho (com as habilidades daquele ponto), para testar o level design */
function prisonWarp(i){
  /* [fogueira, x, z, chão, habilidades já ganhas (0–3)] */
  const pts=[[0,0,9.6,0,0],[1,-2,-48.5,0,0],[1,0,-58,0,1],[2,-2.6,-93,F3,1],[3,11.4,-115.4,F3,2],[4,0,-131,F3,3]];
  const w=pts[i];if(!w)return;clearWorld();
  abil.climb=w[4]>=1;abil.grab=w[4]>=2;abil.morph=w[4]>=3;
  prison.altars.forEach(function(a){a.taken=!!abil[a.key];});
  prison.cp=Math.min(w[0],prison.cps.length-1);prison.cps.forEach(function(c,k){c.lit=k<=prison.cp;});
  prison.done=false;prison.won=false;
  prison.locks.forEach(function(L){L.cleared=i>=1;L.closed=!L.cleared;lockRoom(L,false);L.wave=-1;L.active=[];});
  prison.bossIn.closed=true;lockRoom(prison.bossIn,false);prison.bossOut.closed=false;lockRoom(prison.bossOut,true);
  if(i===5)prison.cracks.forEach(function(c){if(!c.broken){c.broken=true;const k=boxes.indexOf(c);if(k>=0)boxes.splice(k,1);c.mesh.visible=false;(c.lines||[]).forEach(function(l){l.visible=false;});}});
  prisonPopulate();
  st.x=PX+w[1];st.z=w[2]+1.4;st.y=w[3];st.rot=st.rotT=Math.PI;st.yaw=0;plantFeet();
  flashMsg('Trecho '+(i+1),1.2);
}
/* minimapa: salas visitadas, personagem (vermelho), inimigos acordados, fogueiras e altares */
function drawMini(){
  const W=miniEl.width,H=miniEl.height,zt=20,zb=-172,xs=-17,xe=17,k=Math.min(W/(xe-xs),H/(zt-zb));
  const tx=function(x){return (x-PX-xs)*k;},tz=function(z){return (zt-z)*k;};
  miniCtx.clearRect(0,0,W,H);miniCtx.fillStyle='rgba(10,9,12,.55)';miniCtx.fillRect(0,0,W,H);
  prison.rects.forEach(function(r){miniCtx.fillStyle=prison.seen[r.id]?(r.f>0?'#6d6458':'#5a5248'):'rgba(90,82,72,.18)';
    miniCtx.fillRect(tx(r.x0),tz(r.z1),(r.x1-r.x0)*k,(r.z1-r.z0)*k);});
  prison.cps.forEach(function(c){miniCtx.fillStyle=c.lit?'#ffa040':'#6a4a2a';miniCtx.fillRect(tx(c.x)-1.5,tz(c.z)-1.5,3,3);});
  prison.altars.forEach(function(a){if(a.taken)return;miniCtx.fillStyle='#7fd0ff';miniCtx.fillRect(tx(a.x)-1.5,tz(a.z)-1.5,3,3);});
  enemies.forEach(function(e){if(e.dead||!(e.aggro||e.type==='boss'))return;miniCtx.fillStyle=e.type==='boss'?'#ff3030':'#c07070';miniCtx.fillRect(tx(e.g.position.x)-1,tz(e.g.position.z)-1,e.type==='boss'?4:2,e.type==='boss'?4:2);});
  miniCtx.fillStyle='#ff4040';miniCtx.beginPath();miniCtx.arc(tx(st.x),tz(st.z),2.6,0,6.3);miniCtx.fill();
}
if(/prisao|prison/i.test(location.hash))setTimeout(enterPrison,0);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

window.AETH={prog:function(){return combo.cur?progA(combo.cur,combo.t):0;},get heroThrown(){return heroThrown;},spawnGrabber:function(){return spawnEnemy('grab');},get grab(){return grab;},grabNow:function(){grabKey();},RUN_ATT:RUN_ATT,get airAtk(){return airAtk;},get flip(){return flip;},get dodge(){return dodge;},dodgeNow:function(ix,iz){return startDodge(ix,iz);},toggleGod:function(){toggleGod();},get hp(){return hp;},hitMe:function(dx,dz){takeHit(st.x+dx,st.z+dz,8);},get hitR(){return hitR;},get landT(){return landT;},get climb(){return climb;},dropClimb:function(){climb=null;hero.quaternion.set(0,0,0,1);},get death(){return death;},kill:function(){hp=0;},SOUND:SOUND,SFX:SFX,attackNow:function(){const p0=paused;paused=false;attack();paused=p0;},tick:tick,get paused(){return paused;},get hitStop(){return hitStop;},clipSrc:clipSrc,st:st,combo:combo,get ATT(){return ATT;},startAttack:startAttack,enemies:enemies,joy:joy,feet:feet,render:function(){renderer.render(scene,cam);},MUSIC:MUSIC,get rig(){return rig;},get custom(){return custom;},get PERFIL(){return PERFIL;},CLAW:CLAW,MRUN:MRUN,MWALK:MWALK,MGUARD:MGUARD,get armForm(){return armForm;},get morphSeq(){return morphSeq;},toggleMorph:function(){toggle();},get acts(){return acts;},cam:cam,get WORLD(){return WORLD;},enterPrison:function(){enterPrison();},enterArena:function(){enterArena();},prisonWarp:function(i){prisonWarp(i);},prison:prison,abil:abil,boxes:boxes,BLOOD:BLOOD};
